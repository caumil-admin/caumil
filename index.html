<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="description" content="CAUMIL 개인·팀 논문 원고를 경진대회 6개 변수로 채점하고 사전함수로 적합도·순위·백분위·사분위를 매긴 학술 지표 페이지" />
<meta name="theme-color" content="#F6F5FA" />
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<meta name="robots" content="noindex" />
<title>CAUMIL 논문 지표</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet" />
<style>
/* CAUMIL 논문 지표 v2 — 학술 지표 색인형. 토큰은 Claude Design 캔버스(9tBbBaMpePcUWcuFiKSsCm)에서 옮겼다. */
:root {
  --bg: #F6F5FA; --surface: #FFFFFF; --surface-2: #EFEDF5; --zebra: #FAF9FC;
  --ink: #1B1A2E; --muted: #5B5872; --rule: #DFDCE9; --rule-2: #C7C3D6;
  --accent: #56489E; --accent-hover: #3E3378; --accent-soft: #ECE9F7; --accent-rgb: 86, 72, 158;
  --up: #0E6B5C; --down: #9E3B2A;
  --q1-fg: #0E6B5C; --q1-bg: #E0F1EC; --q2-fg: #356B25; --q2-bg: #E8F2DF; --q3-fg: #845A08; --q3-bg: #F6EDD6; --q4-fg: #9E3B2A; --q4-bg: #F6E3DE;
  --upd-fg: #845A08; --upd-bg: #F6EDD6; --chip-ink: #1B1A2E; --on-chip: #FFFFFF;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-serif: "Noto Serif KR", "AppleMyungjo", "Batang", Georgia, serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --gutter: 32px; --max: 1440px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12101C; --surface: #1A1727; --surface-2: #211D33; --zebra: #1D1A2C;
    --ink: #ECEAF5; --muted: #A39FBA; --rule: #2F2A45; --rule-2: #3D3757;
    --accent: #A99AE6; --accent-hover: #C4B9F0; --accent-soft: #2A2447; --accent-rgb: 169, 154, 230;
    --up: #5FCFB6; --down: #F09A88;
    --q1-fg: #7FD8C4; --q1-bg: #12332C; --q2-fg: #A9D68E; --q2-bg: #1E2E15; --q3-fg: #E8C57A; --q3-bg: #3A2C10; --q4-fg: #F0A090; --q4-bg: #3B1F1A;
    --upd-fg: #E8C57A; --upd-bg: #3A2C10; --chip-ink: #ECEAF5; --on-chip: #12101C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12101C; --surface: #1A1727; --surface-2: #211D33; --zebra: #1D1A2C;
  --ink: #ECEAF5; --muted: #A39FBA; --rule: #2F2A45; --rule-2: #3D3757;
  --accent: #A99AE6; --accent-hover: #C4B9F0; --accent-soft: #2A2447; --accent-rgb: 169, 154, 230;
  --up: #5FCFB6; --down: #F09A88;
  --q1-fg: #7FD8C4; --q1-bg: #12332C; --q2-fg: #A9D68E; --q2-bg: #1E2E15; --q3-fg: #E8C57A; --q3-bg: #3A2C10; --q4-fg: #F0A090; --q4-bg: #3B1F1A;
  --upd-fg: #E8C57A; --upd-bg: #3A2C10; --chip-ink: #ECEAF5; --on-chip: #12101C;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } *, *::before, *::after { transition: none !important; } }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.55; -webkit-font-smoothing: antialiased; min-height: 100%; display: flex; flex-direction: column; }
a { color: var(--accent); }
a:hover { color: var(--accent-hover); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.serif { font-family: var(--font-serif); }
.muted { color: var(--muted); }
.clamp2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.skip-link { position: fixed; z-index: 100; top: 10px; left: 10px; padding: 8px 12px; background: var(--accent); color: var(--surface); border-radius: 6px; transform: translateY(-160%); }
.skip-link:focus { transform: translateY(0); }
.inner { width: 100%; max-width: var(--max); margin: 0 auto; padding-inline: var(--gutter); }

/* ---------- header ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); border-bottom: 1px solid var(--rule); }
.top-inner { display: flex; align-items: stretch; gap: 24px; min-height: 60px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); white-space: nowrap; }
.brand-mark { font-family: var(--font-mono); font-size: 13px; font-weight: 600; letter-spacing: 0.18em; }
.brand-name { font-size: 17px; font-weight: 700; }
.top-nav { display: flex; align-items: stretch; gap: 4px; font-size: 14px; }
.top-nav a { display: flex; align-items: center; padding: 0 12px; text-decoration: none; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
.top-nav a:hover { color: var(--ink); }
.top-nav a[aria-current="page"] { color: var(--accent); font-weight: 600; border-bottom-color: var(--accent); }
.top-tools { margin-left: auto; display: flex; align-items: center; gap: 16px; }
.search { display: flex; align-items: center; gap: 8px; width: 300px; height: 36px; padding: 0 12px; border: 1px solid var(--rule-2); border-radius: 6px; background: var(--bg); color: var(--muted); }
.search input { border: 0; outline: 0; background: transparent; font-size: 13px; color: var(--ink); width: 100%; min-width: 0; }
.search input::-webkit-search-cancel-button { cursor: pointer; }
.version { display: flex; font-size: 12.5px; border: 1px solid var(--rule-2); border-radius: 6px; overflow: hidden; white-space: nowrap; }
.version a { display: flex; align-items: center; height: 34px; padding: 0 12px; text-decoration: none; color: var(--ink); }
.version a.cur { background: var(--chip-ink); color: var(--on-chip); font-weight: 600; }
.m-row { display: none; }

/* ---------- page head ---------- */
.page-head { background: var(--surface); border-bottom: 1px solid var(--rule); }
.page-head .inner { padding-block: 20px 18px; display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; flex-wrap: wrap; }
.head-copy { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.crumbs { display: flex; gap: 6px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.crumbs a { color: var(--muted); }
.title-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.title { font-size: 28px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.25; }
.pill { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--rule-2); color: var(--muted); white-space: nowrap; }
.lede { font-size: 13px; color: var(--muted); max-width: 72ch; }
.meta-dl { margin: 0; display: flex; gap: 32px; font-size: 12px; flex-wrap: wrap; }
.meta-dl > div { display: flex; flex-direction: column; gap: 2px; }
.meta-dl dt { color: var(--muted); }
.meta-dl dd { margin: 0; font-size: 14px; }

/* ---------- generic blocks ---------- */
.card { background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; min-width: 0; }
.card-h { display: flex; align-items: baseline; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--rule); flex-wrap: wrap; }
.card-h h2 { font-size: 15px; font-weight: 700; }
.card-h span { font-size: 12.5px; color: var(--muted); }
.card-b { padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }
.card-b h2 { font-size: 15px; font-weight: 700; }
.sub { font-size: 12px; color: var(--muted); }
.note { font-size: 12px; line-height: 1.6; color: var(--muted); }
.notes { display: flex; flex-direction: column; gap: 4px; }
.q { font-family: var(--font-mono); font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 4px; white-space: nowrap; }
.q1 { color: var(--q1-fg); background: var(--q1-bg); } .q2 { color: var(--q2-fg); background: var(--q2-bg); }
.q3 { color: var(--q3-fg); background: var(--q3-bg); } .q4 { color: var(--q4-fg); background: var(--q4-bg); }
.badge { font-size: 11px; font-weight: 600; padding: 0 6px; border-radius: 3px; line-height: 1.7; white-space: nowrap; }
.b-new { color: var(--surface); background: var(--accent); }
.b-upd { color: var(--upd-fg); background: var(--upd-bg); }
.b-high { color: var(--down); background: var(--q4-bg); } .b-mid { color: var(--upd-fg); background: var(--upd-bg); }
.chip { padding: 3px 10px; border-radius: 999px; border: 1px solid var(--rule-2); font-size: 12px; white-space: nowrap; }
.chip.on { background: var(--accent); color: var(--surface); border-color: var(--accent); font-weight: 600; }
.chip.upd { color: var(--upd-fg); background: var(--upd-bg); border-color: transparent; font-weight: 600; }
.btn { font-size: 12.5px; height: 34px; padding: 0 12px; border-radius: 6px; border: 1px solid var(--rule-2); background: var(--surface); color: var(--ink); display: inline-flex; align-items: center; gap: 6px; text-decoration: none; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn:disabled { color: var(--muted); cursor: default; border-color: var(--rule); }
.btn:disabled:hover { color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--rule-2); border-radius: 6px; overflow: hidden; }
.seg button { font-size: 12.5px; min-height: 32px; padding: 0 12px; border: 0; background: var(--surface); color: var(--ink); }
.seg button + button { border-left: 1px solid var(--rule-2); }
.seg button[aria-pressed="true"] { background: var(--chip-ink); color: var(--on-chip); font-weight: 600; }
.bar { height: 5px; background: var(--rule); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.empty { padding: 28px; text-align: center; font-size: 13px; color: var(--muted); border-top: 1px solid var(--rule); }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); padding: 10px 16px; border-radius: 8px; background: var(--chip-ink); color: var(--on-chip); font-size: 13px; z-index: 50; box-shadow: 0 6px 24px rgba(0,0,0,0.18); }

/* ---------- rank page ---------- */
.rank-layout { display: grid; grid-template-columns: 264px minmax(0, 1fr); align-items: start; gap: 0 12px; }
.filters { padding-block: 20px 24px; padding-right: 8px; display: flex; flex-direction: column; gap: 24px; font-size: 13px; }
.filters fieldset { margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.filters legend, .filters .lg { padding: 0 0 8px; font-size: 12px; font-weight: 600; color: var(--muted); }
.cat-btn { font-size: 13px; min-height: 40px; display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 0 12px; border-radius: 6px; text-align: left; border: 1px solid var(--rule); background: var(--surface); color: var(--ink); }
.cat-btn[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.cat-btn .n { font-family: var(--font-mono); font-size: 12px; }
.chk { display: flex; align-items: center; gap: 8px; min-height: 30px; cursor: pointer; }
.chk input { margin: 0; width: 15px; height: 15px; accent-color: var(--accent); flex-shrink: 0; }
.chk .grow { flex-grow: 1; }
.chk .n { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.qlegend { display: flex; gap: 6px; flex-wrap: wrap; }
.rank-main { min-width: 0; padding-block: 16px 24px; display: flex; flex-direction: column; gap: 12px; }
.toolbar { min-height: 36px; display: flex; align-items: center; justify-content: space-between; gap: 16px; font-size: 13px; flex-wrap: wrap; }
.toolbar .right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.warn { font-size: 12px; color: var(--upd-fg); }
.tbl { background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
.tbl-scroll { overflow-x: auto; }
.tgrid { display: grid; grid-template-columns: 52px minmax(240px, 1fr) 84px 64px 64px 64px repeat(6, 46px) 104px; align-items: center; min-width: 980px; }
.tgroup { background: var(--surface-2); font-size: 11.5px; color: var(--muted); }
.tgroup span { grid-column: 7 / span 6; padding: 8px 0 0; text-align: center; font-weight: 600; border-bottom: 1px solid var(--rule-2); margin: 0 6px; }
.thead { background: var(--surface-2); border-bottom: 1px solid var(--rule-2); }
.thead button { font-size: 12px; border: 0; background: transparent; min-height: 38px; padding: 0 6px; display: flex; align-items: center; gap: 3px; color: var(--muted); font-weight: 500; width: 100%; }
.thead button.on { color: var(--accent); font-weight: 700; }
.thead button:disabled { cursor: default; }
.thead button .arr { font-size: 9px; }
.j-c { justify-content: center; } .j-e { justify-content: flex-end; } .j-s { justify-content: flex-start; }
.trow { min-height: 72px; border-top: 1px solid var(--rule); }
.trow:nth-child(even) { background: var(--zebra); }
.trow.top2 { box-shadow: inset 3px 0 0 var(--accent); }
.trow.top2 .c-rank { color: var(--accent); }
.c-rank { font-family: var(--font-mono); font-size: 16px; font-weight: 600; text-align: center; }
.c-title { min-width: 0; padding: 10px 14px 10px 6px; display: flex; flex-direction: column; gap: 4px; }
.c-title a { font-family: var(--font-serif); font-size: 14px; font-weight: 600; line-height: 1.45; text-decoration: none; }
.c-title .who { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.c-title .who b { color: var(--ink); font-weight: 600; }
.c-prim { padding-right: 12px; display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }
.c-prim .v { font-family: var(--font-mono); font-size: 15px; font-weight: 600; }
.c-prim .bar { width: 58px; height: 3px; }
.c-sec { font-family: var(--font-mono); font-size: 13px; text-align: right; padding-right: 12px; color: var(--muted); }
.c-q { display: flex; justify-content: center; }
.c-pctl { font-family: var(--font-mono); font-size: 13px; text-align: right; padding-right: 12px; }
.c-var { align-self: stretch; display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 12.5px; border-left: 1px solid var(--surface); }
.c-range { padding: 0 12px; display: flex; flex-direction: column; gap: 5px; }
.c-range .t { font-family: var(--font-mono); font-size: 12px; }
.c-prim .mq { display: none; }
.rbar { position: relative; display: block; height: 4px; background: var(--rule); border-radius: 2px; }
.rbar i { position: absolute; top: 0; height: 4px; border-radius: 2px; background: var(--accent); }

/* ---------- categories page ---------- */
.cat-wrap { padding-block: 20px 28px; display: flex; flex-direction: column; gap: 12px; }
.cgrid { display: grid; grid-template-columns: minmax(200px, 1fr) 56px 84px 84px 272px 176px repeat(6, 46px) 80px; align-items: center; min-width: 1176px; }
.chead { align-items: end; background: var(--surface-2); border-bottom: 1px solid var(--rule-2); font-size: 12px; color: var(--muted); }
.chead > span { padding: 12px 8px; }
.chead .dist { padding: 8px 16px 10px; display: flex; flex-direction: column; gap: 4px; }
.chead .dist .ax { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 10.5px; }
.chead .means { grid-column: span 6; padding: 8px 0 0; display: flex; flex-direction: column; gap: 6px; }
.chead .means .t { text-align: center; font-weight: 600; }
.chead .means .k { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); border-top: 1px solid var(--rule-2); }
.chead .means .k span { padding: 6px 0; text-align: center; }
.crow { min-height: 60px; border-top: 1px solid var(--rule); }
.crow.sub-row { background: var(--zebra); }
.crow .lab { padding: 10px 16px; display: flex; flex-direction: column; gap: 2px; }
.crow .lab a { text-decoration: none; }
.crow .lab.ind { padding-left: 44px; }
.crow .lab a.big { font-size: 14px; font-weight: 600; }
.crow .lab a.sm { font-size: 13.5px; font-weight: 500; }
.crow .num { font-family: var(--font-mono); font-size: 14px; text-align: right; padding-right: 10px; }
.dist-cell { padding: 0 16px; }
.dist { position: relative; display: block; height: 30px; }
.dist .ax { position: absolute; left: 0; right: 0; top: 18px; height: 1px; background: var(--rule-2); }
.dist .med { position: absolute; top: 11px; width: 2px; height: 15px; margin-left: -1px; background: var(--ink); }
.dist .dot { position: absolute; top: 13px; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; background: rgba(var(--accent-rgb), 0.55); border: 1px solid var(--accent); }
.dist .top { position: absolute; top: 0; font-family: var(--font-mono); font-size: 10.5px; font-weight: 600; color: var(--accent); transform: translateX(-50%); }
.crow .topc { padding: 6px 8px; display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; min-width: 0; }
.crow .topc .f { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.crow .topc .r { font-family: var(--font-mono); font-weight: 600; color: var(--accent); margin-right: 4px; }
.crow .mean { align-self: stretch; display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 12.5px; border-left: 1px solid var(--surface); }
.crow .st { font-family: var(--font-mono); font-size: 13px; text-align: right; padding-right: 12px; }

/* ---------- method page ---------- */
.method-layout { padding-block: 24px 32px; display: grid; grid-template-columns: minmax(0, 1fr) 600px; gap: 24px; align-items: start; }
.col { min-width: 0; display: flex; flex-direction: column; gap: 20px; }
.formula { display: grid; grid-template-columns: 96px minmax(0, 1fr); row-gap: 10px; column-gap: 12px; padding: 14px 16px; border-radius: 6px; background: var(--bg); font-family: var(--font-mono); font-size: 13.5px; line-height: 1.5; overflow-x: auto; }
.formula span:nth-child(odd) { color: var(--muted); }
.vgrid { display: grid; grid-template-columns: 150px minmax(0, 1fr) 76px 76px; gap: 12px; padding: 11px 18px; border-top: 1px solid var(--rule); font-size: 13px; align-items: start; }
.vgrid.h span { white-space: nowrap; }
.vgrid.h { background: var(--surface-2); font-size: 12px; color: var(--muted); border-top: 0; padding-block: 8px; }
.vgrid.f { background: var(--surface-2); border-top: 1px solid var(--rule-2); font-weight: 600; padding-block: 10px; }
.vgrid .r { font-family: var(--font-mono); text-align: right; }
.vgrid .anch { font-size: 12.5px; line-height: 1.6; color: var(--muted); }
.vgrid .key { font-family: var(--font-mono); font-size: 11px; color: var(--muted); display: block; }
.defs { margin: 0; display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 10px 16px; }
.defs dt { font-weight: 600; font-size: 13px; }
.defs dd { margin: 0; font-size: 13px; line-height: 1.65; color: var(--muted); }
.defs ul { margin: 0; padding-left: 18px; }
.lab-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.preset-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.preset-btn { font-size: 12.5px; min-height: 40px; padding: 0 8px; border-radius: 6px; border: 1px solid var(--rule-2); background: var(--surface); color: var(--ink); }
.preset-btn[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.sliders { display: flex; flex-direction: column; gap: 4px; }
.slider { display: grid; grid-template-columns: 150px minmax(0, 1fr) 56px; gap: 12px; align-items: center; min-height: 36px; font-size: 13px; }
.slider input { width: 100%; accent-color: var(--accent); margin: 0; }
.slider output { font-family: var(--font-mono); font-size: 13px; text-align: right; }
.formula-line { padding: 10px 12px; border-radius: 6px; background: var(--bg); font-family: var(--font-mono); font-size: 11.5px; line-height: 1.6; overflow-wrap: anywhere; }
.lab-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 12.5px; }

.up { color: var(--up); } .down { color: var(--down); }
.hwc { color: var(--accent); }
.txt { font-size: 13.5px; line-height: 1.75; }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px; }
